services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports: ["8090:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # para usar mi docker
    user: root
  nexus:
    image: sonatype/nexus3
    ports: ["8081:8081"]
    volumes: [nexus_data:/nexus-data]
  sonarqube:
    image: sonarqube:community
    ports: ["9000:9000"]
volumes: { jenkins_home: {}, nexus_data: {} }